            --table-header: #172033;
            --table-row-alt: #101622;

        :root[data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --sidebar-bg: #f8fafc;
            --border-color: #e2e8f0;

            margin: 0;
            padding: 0;

            scroll-behavior: smooth;

            min-height: 100vh;
            transition: background-color 0.25s, color 0.25s;

        /* Ultra-Aesthetic Sidebar Navigation */
        #sidebar {
            width: 330px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 2px 0 16px rgba(0, 0, 0, 0.08);
            transition: background-color 0.25s, border-color 0.25s;
        }

        #sidebar::-webkit-scrollbar {
            width: 4px;
        }
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        #sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        .sidebar-header {
            padding: 16px 14px 12px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--sidebar-bg) 100%);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
            flex-shrink: 0;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .brand-sub {
            font-size: 0.68rem;
            color: var(--text-dim);
            font-weight: 500;
            line-height: 1.2;
        }

        /* Pill Theme Toggle Switch */
        .theme-toggle-pill {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        .theme-toggle-pill:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .sidebar-badge-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .sidebar-chip {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .sidebar-chip.green {
            background-color: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.2);
        }

        /* Sleek Search Box */
        .sidebar-search-area {
            padding: 8px 12px 6px;
        }

        .search-box-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon-svg {
            position: absolute;
            left: 10px;
            color: var(--text-dim);
            pointer-events: none;
            width: 13px;
            height: 13px;
        }

        .search-box-wrap input {
            width: 100%;
            padding: 7px 32px 7px 28px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.78rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-box-wrap input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
            background-color: var(--bg-primary);
        }

        .search-shortcut-hint {
            position: absolute;
            right: 8px;
            font-size: 0.6rem;
            padding: 1px 4px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-dim);
            pointer-events: none;
        }

        /* Section List */
        .sidebar-nav-content {
            flex: 1;
            padding: 6px 8px 16px;
            overflow-y: auto;
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .toc-item {
            position: relative;
        }

        .toc-item a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.78rem;
            padding: 5px 7px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.18s cubic-bezier(0.2, 0, 0, 1);
            cursor: pointer;
            line-height: 1.35;
        }

        .toc-num-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-dim);
            background-color: var(--bg-tertiary);
            padding: 1px 4px;
            border-radius: 3px;
            flex-shrink: 0;
            min-width: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toc-item a:hover {
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
            transform: translateX(2px);
        }

        .toc-item a:hover .toc-num-badge {
            color: var(--accent-blue);
            background-color: rgba(56, 189, 248, 0.12);
        }

        .toc-item a.active {
            color: #ffffff !important;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.16) 0%, rgba(56, 189, 248, 0.02) 100%);
            border-left: 3px solid var(--accent-blue);
            font-weight: 600;
        }

        .toc-item a.active .toc-num-badge {
            background-color: var(--accent-blue);
            color: #ffffff;
            font-weight: 700;
        }

        /* Sidebar Footer Status Widget */
        .sidebar-footer {
            padding: 9px 12px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-top: auto;
        }

        .footer-status-tag {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Main Content Container */
        #main {
            margin-left: 330px;
            flex: 1;
            max-width: 1040px;
            padding: 40px 52px;
        }

        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            margin-top: 2.2rem;
            margin-bottom: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            scroll-margin-top: 24px;
        }

        h1 {
            font-size: 2.0rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        h2 {
            font-size: 1.45rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 7px;
        }

        h3 {
            font-size: 1.18rem;
        }

        p, ul, ol {
            margin-bottom: 1.15rem;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        ul, ol {
            padding-left: 22px;
        }

        li {
            margin-bottom: 5px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2.2rem 0;
        }

        /* CRISP MODERN TABLES */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 20px 0;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-size: 0.9rem;
        }

        th, td {
            padding: 11px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }

        th {
            background-color: var(--table-header);
            font-weight: 700;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            font-family: 'Outfit', sans-serif;
            font-size: 0.92rem;
        }

        tr:nth-child(even) td {
            background-color: var(--table-row-alt);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(88, 166, 255, 0.06);
        }

        /* Code Blocks */
        pre {
            background-color: var(--bg-secondary) !important;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            padding: 14px;
            margin: 18px 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        code:not(pre code) {
            background-color: var(--bg-tertiary);
            color: var(--accent-blue);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
        }

        /* Ultra-Clean Modern Diagram Cards with Interactive Pan & Zoom */
        .diagram-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin: 24px auto;
            max-width: 960px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .diagram-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }

        .diagram-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
            z-index: 10;
        }

        .diagram-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .diagram-badge {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            text-transform: uppercase;
        }

        .diagram-hint {
            font-size: 0.7rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        .diagram-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .zoom-btn {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background-color: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }

        .zoom-btn:active {
            transform: translateY(0);
        }

        .diagram-viewport {
            position: relative;
            width: 100%;
            min-height: 320px;
            overflow: hidden !important;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none !important; /* Prevents browser touch-scroll interference during dragging */
            background-color: #070b12;
            background-image: 
                radial-gradient(circle at center, rgba(56, 189, 248, 0.05) 0%, transparent 75%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px, 28px 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 18px;
        }

        .diagram-viewport.is-dragging {
            cursor: grabbing !important;
        }

        .diagram-scalable {
            transform-origin: center center;
            pointer-events: none;
            will-change: transform;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .diagram-scalable * {
            pointer-events: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        .diagram-scalable svg {
            display: block;
            margin: 0 auto;
            max-width: 100% !important;
            height: auto !important;
            overflow: visible !important;
        }

        /* Fullscreen handling */
        .diagram-card:fullscreen,
        .diagram-card:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            margin: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            background-color: var(--bg-primary) !important;
            z-index: 999999 !important;
        }

        .diagram-card:fullscreen .diagram-viewport,
        .diagram-card:-webkit-full-screen .diagram-viewport {
            flex: 1 1 auto !important;
            height: calc(100vh - 52px) !important;
            min-height: 0 !important;
            max-height: none !important;
            width: 100% !important;
        }

        /* Mermaid Node & Label Text Styling to Prevent Box Overflows */
        .mermaid .node rect, .mermaid .node circle, .mermaid .node polygon {
            stroke-width: 2px !important;
            rx: 6px !important;
            ry: 6px !important;
        }

        .mermaid .edgeLabel {
            background-color: var(--bg-primary) !important;
            padding: 4px 8px !important;
            border-radius: 5px !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
            font-size: 0.74rem !important;
        }

        .mermaid .cluster rect {
            fill: rgba(15, 23, 42, 0.4) !important;
            stroke: rgba(56, 189, 248, 0.25) !important;
            stroke-width: 1.5px !important;
            stroke-dasharray: 4 4 !important;
            rx: 8px !important;
            ry: 8px !important;
        }

        /* Blockquotes / Callouts */
        blockquote {
            background-color: rgba(88, 166, 255, 0.08);
            border-left: 4px solid var(--accent-blue);
            padding: 12px 16px;
            border-radius: 0 7px 7px 0;
            margin: 18px 0;
            color: var(--text-primary);
            font-size: 0.93rem;
        }
    </style>

# EXECUTIVE SUMMARY

Generative artificial intelligence has introduced a critical dilemma into modern academic scholarship and higher education: **the speed of content generation has outpaced the depth of critical comprehension**. When scholars, educators, and students interact with conventional AI chatbots through rapid, unreflective queries (rapid-fire prompting), two major systemic crises emerge:

1. **Cognitive Atrophy and Epistemic Erosion**: Users become passive consumers of machine-generated text, gradually losing the core scholarly habits of problem framing, contextual critique, systematic decomposition, and grounded reasoning.
2. **Hidden Environmental & Infrastructure Footprint**: Every redundant query dispatched to cloud data centers consumes electrical energy, emits greenhouse gases, and evaporates freshwater for cooling. In institutional lab settings, unconstrained prompt spamming exhausts computational quotas and inflates operating budgets without improving learning outcomes.

**S-SPARC AI™ (Specific Smart Prompting Assistant for perfoRmanCe / Sustainable Smart Personal Assistant for Responsible Consumption)** is an educational framework and intelligent research companion designed to transform generative AI from a passive "answer dispenser" into a **metacognitive dialectical partner**. 

Developed by the **ITMCU Research Team at Maranatha Christian University** and recognized at the **UNU Global Youth AI Future Innovation Competition 2026 (UNU Macau)**, S-SPARC operates on a foundational constructivist premise: *a tutoring AI should make a learner work intentionally for the right reasons, not surrender full answers the moment an inquiry is submitted*.

By structuring inquiries through the **C-I-O-E Protocol**, enforcing intentional **Reflexive Pauses (Productive Friction)**, delivering **3-Tier Progressive Scaffolding**, retrieving verified institutional knowledge at **zero token cost (<45ms)**, analyzing cognitive trajectories via **Shannon Information Density ($H(X)$)**, celebrating reflective milestones via **S-SPARC Prompt Wrapped**, and quantifying the ecological footprint of every query in real time, S-SPARC preserves human intellectual agency while championing green academic computing.

# 1. PHILOSOPHICAL AND CONSTRUCTIVIST FOUNDATIONS: RESTORING HUMAN AGENCY

In higher education, authentic mastery demands **active cognitive struggle** rather than passive text consumption. Conventional AI chatbots deliver complete, ready-made solutions immediately, creating an illusion of understanding (the "fluency illusion") while eroding independent analytical capability.

S-SPARC grounds its operational AI interaction models in proven educational and cognitive theories:

### Three Core Theoretical Pillars:
1. **Active Knowledge Construction (Piaget / Vygotsky)**: Learners construct internal mental schemas through active reflection and trial. S-SPARC demands reflection and problem decomposition before revealing explanations.
2. **Zone of Proximal Development (ZPD) (Vygotsky)**: S-SPARC targets the optimal cognitive band between unassisted capability and guided assistance, dynamically calibrating hints to the student's demonstrated level of understanding.
3. **Scaffolding and Gradual Release of Responsibility (Bruner / Wood et al.)**: High structural support is provided initially, systematically peeling back assistance as the student demonstrates conceptual competence.

> **Core Foundational Principle: Productive Friction**
> Withholding instant solutions is intentionally engineered to preserve active critical thinking over copy-pasting, transforming AI into a cognitive sounding board rather than a cognitive replacement.

| Dimension | Conventional AI Chatbot Model | S-SPARC Reflexive Pedagogical Model |
| :--- | :--- | :--- |
| **User Role** | Passive consumer of ready-made text | Active problem framer and critical interrogator |
| **Interaction Dynamic** | Unrestricted rapid-fire prompting loop | Structured C-I-O-E inquiry with 60s Reflexive Pause |
| **Scaffolding Depth** | Instant full solution dump | 3-Tier Progressive Hints (Concept $\to$ Blueprint $\to$ Solution) |
| **Information Quality** | Vague, single-line input accepted | Shannon Entropy $H(X)$ & C-I-O-E completeness check |
| **Reflection Mechanism** | None; immediate next prompt | Per-assessment **Prompt Wrapped** 6-slide story player |
| **Environmental Cost** | Invisible, unmeasured cloud footprint | Real-time transparent energy, carbon, and water telemetry |
| **Educational Outcome** | Cognitive offloading and dependency | Independent analytical mastery and grounded reasoning |

# 3. THE C-I-O-E INQUIRING PROTOCOL AND BLOOM'S TAXONOMY INTEGRATION

S-SPARC replaces unstructured prompting with the **C-I-O-E Protocol**, directly mapped to **Bloom's Revised Taxonomy**:

| Component | Pedagogical Scope | Practical Expectation & Operational Definition |
| :--- | :--- | :--- |
| **[C] Context** | Course Setting & Problem Background | Course module, problem domain, programming environment, or theoretical premise |
| **[I] Input** | Input Parameters & Problem Data | Concrete test cases, variable definitions, dataset excerpts, or code snippet under test |
| **[O] Output** | Expected Target Result | Desired return value, target algorithm behavior, or required analytical format |
| **[E] Error Trace** | Observed Bug, Exception, or Impasse | Exact compiler traceback, runtime exception, logical discrepancy, or reasoning barrier |

### Operational Modes Aligned with Bloom's Taxonomy:
* **C1 / C2: Remember & Understand (Conceptual Validation Mode)**: Delivers analogies, conceptual boundaries, and high-level mapping without direct code or final answers.
* **C3 / C4: Apply & Analyze (Targeted Analytical Mode)**: Delivers step-by-step blueprints, minimal delta hints, and edge case interrogations to guide student-led debugging.
* **C5 / C6: Evaluate & Create (Socratic Scaffolding Mode)**: Interrogates student architecture choices, evaluates computational complexity ($O(N)$), and stimulates innovative synthesis.

# 4. AI CRITIC EVALUATION, SHANNON ENTROPY H(X), AND SOCRATIC SCAFFOLDING ENGINE

To provide rigorous, objective feedback on student inquiry quality, S-SPARC integrates an **Information-Theoretic AI Critic Engine**:

### 1. Shannon Information Density Formulation
The Shannon Entropy $H(X)$ measures the lexical diversity, uncertainty, and information content embedded within the student's inquiry:

$$H(X) = -\sum_{i=1}^{n} P(x_i) \log_2 P(x_i)$$

Where $P(x_i)$ represents the empirical probability frequency of word token $x_i$ within the inquiry string. To standardize across prompt lengths, S-SPARC computes **Normalized Entropy** $H_{\text{norm}}$:

$$H_{\text{norm}} = \frac{H(X)}{\log_2 |V|}$$

Where $|V|$ represents the unique vocabulary size of the inquiry. 
* **$H_{\text{norm}} \ge 0.70$ (High Information Density)**: Demonstrates rich technical vocabulary, explicit variables, and structured problem framing.
* **$0.45 \le H_{\text{norm}} < 0.70$ (Moderate Density)**: Acceptable baseline; guided hints encourage adding specific error traces.
* **$H_{\text{norm}} < 0.45$ (Low Density / Spam)**: Triggers an automated prompt refinement suggestion before cloud execution.

### 2. C-I-O-E Protocol Completeness Index
The total C-I-O-E score $S_{\text{CIOE}} \in [0, 100\%]$ is computed as a weighted composite:

$$S_{\text{CIOE}} = 0.25 \cdot S_C + 0.25 \cdot S_I + 0.25 \cdot S_O + 0.25 \cdot S_E$$

Each dimension is scored $[0 - 100\%]$ based on semantic presence, parameter clarity, and technical specificity.

### 3. Automated Socratic Scaffolding & Prompt Rewriting
When an inquiry scores below institutional thresholds, the AI Critic generates a **Socratic Scaffolding Recommendation** and a **Suggested Prompt Rewrite**, illustrating how the student can transform a lazy question into an academically rigorous inquiry.

# 5. THE REFLEXIVE PAUSE AND 3-TIER PROGRESSIVE SCAFFOLDING SYSTEM

To prevent students from skipping cognitive struggle, S-SPARC enforces a **3-Tier Progressive Scaffolding Model**:

| Attempt Stage | Pedagogical Hint Level | System Action and Behavioral Expectation |
| :--- | :--- | :--- |
| **1st Attempt** | **Tier 1: Clue on the Concept** | Explains the underlying theoretical principle or common misconception. Contains zero code and zero direct answers. |
| **2nd Attempt** | **Tier 2: Clue on the Blueprint** | Provides an algorithmic sequence, pseudocode outline, or structural blueprint if the student remains stuck. |
| **3rd Attempt** | **Tier 3: Full Detailed Solution** | Reveals the complete solution, code correction, and deep architectural debrief only after two verified independent attempts. |

The S-SPARC system is decoupled into five distinct, specialized architectural layers:

#### Layer 1: Client & LMS Presentation Tier
* **Student Inquiry Workbench**: Implements the guided four-field C-I-O-E input interface, dynamic 60-second countdown timer for Productive Friction, mathematical KaTeX rendering, and syntax-highlighted code diff viewers.
* **Prompt Wrapped Story Player (`student_prompt_wrapped.php`)**: A full-screen, six-slide interactive story module inspired by modern data storytelling. Delivers personalized cognitive reflection (iterations, Shannon entropy, C-I-O-E dimensions, green telemetry, and persona classification) once assessment deadlines expire.
* **Faculty Analytics Hub (`faculty_analytics.php`)**: Provides instructors with real-time cohort visibility, automated flagging of struggling students, Bloom's taxonomy cognitive distribution radars, and one-click pseudonymized CSV export for empirical educational research.
* **E-STRANGE Core LMS Integration**: Seamlessly integrates into existing programming assessment flows, student submissions (`student_submission.php`), and course enrollment registries.

#### Layer 2: Security, SSO & Interoperability Gateway
* **SSO Bridge (`_sso_bridge.php`)**: Authenticates student and faculty sessions across the PHP LMS frontend and FastAPI backend using HMAC-SHA256 signed session tokens, guaranteeing zero credential exposure.
* **Dynamic Asset Rewriter (`_asset_rewriter.php`)**: Automatically intercepts and normalizes internal asset paths, vendor stylesheets (DataTables, Bootstrap, SweetAlert2), and CDN scripts, eliminating 404 resource errors across varied deployment subdirectories.
* **Role-Based Access Control (RBAC)**: Enforces strict boundary isolation between student learners (restricted to personal prompt history and hint progression), teaching assistants (cohort guidance), and faculty researchers (pseudonymized macro telemetry).

#### Layer 3: S-SPARC Asynchronous Microservice Engine (FastAPI Python 3.12)
* **C-I-O-E & Shannon Entropy Linter**: Operates on a sub-10ms asynchronous event loop. Computes normalized Shannon Information Entropy $H_{\text{norm}}$ to evaluate inquiry vocabulary richness and scores the four C-I-O-E dimensions before LLM dispatch.
* **Hybrid Semantic Memory Engine**: Combines dense vector similarity using `SentenceTransformers (all-MiniLM-L6-v2)` with sparse keyword matching using `BM25Okapi`. The two ranking vectors are merged via **Reciprocal Rank Fusion (RRF)**:
  $$RRF\_Score(d) = \sum_{m \in \{\text{dense}, \text{sparse}\}} \frac{1}{k + r_m(d)}$$
  Where $k = 60$ is the smoothing constant, and $r_m(d)$ is the rank of document $d$ under model $m$. Cache hits ($\ge 0.88$ similarity) return in $<45\text{ms}$ at **$0.00 token cost** and **$0\text{ Wh}$ additional inference emissions**.
* **Dynamic Multi-Tier Fallback Router & Circuit Breaker**: Dispatches queries across cloud and on-premise providers. Automatically detects API rate limits (HTTP 429), quota exhaustion, or gateway timeouts (HTTP 504), triggering instantaneous fallback with exponential backoff.
* **Thermodynamic Environmental Engine**: Computes exact physics-based inference energy, greenhouse gas emissions, and datacenter cooling water consumption for every query based on active token counts, Power Usage Effectiveness ($\text{PUE } 1.12$), and regional electrical Grid Emission Factors ($\text{GEF } 0.475\text{ g CO}_2\text{e/Wh}$).

#### Layer 4: Multi-Tier Model Execution Layer
* **Tier 1 (Free High-Speed Cloud LPUs/APIs)**: Ultra-fast cloud inference (Groq LPUs running Llama-3.3-70B, Cerebras CS-3, Google Gemini 2.5 Flash Lite) delivering dialectical scaffolding in **~1.2s - 1.8s**.
* **Tier 2 (BYOK & Enterprise Pooled Key Orchestrator)**: Fallback orchestrator supporting student/instructor Bring-Your-Own-Key (BYOK) configurations and load-balanced departmental API key pools (OpenAI GPT-4o, Anthropic Claude 3.5 Sonnet, Gemini Pro).
* **Tier 3 (On-Premise Air-Gapped Local LLM Runtime)**: Complete offline fallback executing locally on university server hardware via Ollama (Qwen2.5-Coder 14B / DeepSeek-Coder). Provides **100% offline data sovereignty** for confidential qualitative research, human-subject transcripts, and air-gapped laboratory computers.

#### Layer 5: Unified Relational & Vector Persistence
* **E-STRANGE MySQL Platform**: Stores course curricula, student enrollments, assignment specifications, submission source code, evaluation test cases, and timestamped prompt interaction logs.
* **FAISS Vector Index Store**: Stores 384-dimensional dense semantic vector embeddings alongside verified institutional instructor solutions and canonical conceptual blueprints.

### Frequently Asked Questions (FAQ):

#### Q1: Will using S-SPARC compromise the originality of my thesis or code?
> **Answer**: No. S-SPARC is specifically engineered not to solve assignments or write papers on behalf of students. It functions as a metacognitive dialectical partner that challenges assumptions, points out conceptual bugs, and scaffolds reasoning. The student retains full authorship and intellectual ownership.

#### Q2: Why does S-SPARC enforce a 60-second pause between consecutive prompts?
> **Answer**: This is a deliberate pedagogical mechanism known as Productive Friction. The 60-second pause gives learners sufficient time to read the hint, test logic in their IDE, and reflect on underlying concepts, preventing mindless trial-and-error prompting loops.

#### Q3: Why is local offline processing (Tier 3) slower than cloud inference?
> **Answer**: Cloud inference utilizes accelerated multi-GPU clusters (e.g., Groq LPUs or Nvidia H100s) that respond in ~1.2s - 1.8s. In contrast, Tier 3 executes entirely on the local university server CPU/GPU (Ollama Qwen2.5 14B), which requires ~5.5s - 8.2s. While slower, Tier 3 provides 100% offline data sovereignty and guarantees that confidential qualitative or field data never leaves university infrastructure.

#### Q4: What is S-SPARC Prompt Wrapped and how is it generated?
> **Answer**: S-SPARC Prompt Wrapped is an interactive 6-slide data storytelling player generated automatically per assessment once the submission deadline passes. It aggregates prompt iterations, Shannon entropy, C-I-O-E dimensions, green telemetry, and cognitive persona classifications to encourage longitudinal self-reflection.

                            badge.className = 'toc-num-badge';
                            badge.textContent = matchNum[1].padStart(2, '0');
                            a.appendChild(badge);

                            const textSpan = document.createElement('span');
                            textSpan.textContent = matchNum[2];
                            a.appendChild(textSpan);
                        } else if (rawText.toUpperCase().includes('EXECUTIVE SUMMARY')) {
                            const badge = document.createElement('span');
                            badge.className = 'toc-num-badge';
                            badge.textContent = 'EX';
                            a.appendChild(badge);

                            const textSpan = document.createElement('span');
                            textSpan.textContent = 'Executive Summary';
                            a.appendChild(textSpan);
                        } else {
                            const textSpan = document.createElement('span');
                            textSpan.textContent = rawText;
                            a.appendChild(textSpan);
                        }

                        a.onclick = function(e) {
                            e.preventDefault();
                            const target = document.getElementById(slug);
                            if (target) {
                                const headerOffset = 24;
                                const elementPosition = target.getBoundingClientRect().top;
                                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                                window.scrollTo({
                                    top: offsetPosition,
                                    behavior: 'smooth'
                                });
                                history.replaceState(null, null, `#${slug}`);
                                document.querySelectorAll('.toc-item a').forEach(el => el.classList.remove('active'));
                                a.classList.add('active');
                            }
                        };

                        li.appendChild(a);
                        tocContainer.appendChild(li);
                        tocLinks.push({ heading, a });
                    });

                    // ScrollSpy to highlight active link on scroll
                    let scrollTimeout;
                    window.addEventListener('scroll', () => {
                        if (scrollTimeout) clearTimeout(scrollTimeout);
                        scrollTimeout = setTimeout(() => {
                            const scrollPos = window.scrollY + 80;
                            let currentActive = null;
                            for (let i = 0; i < tocLinks.length; i++) {
                                const top = tocLinks[i].heading.offsetTop;
                                if (scrollPos >= top) {
                                    currentActive = tocLinks[i].a;
                                }
                            }
                            if (currentActive) {
                                document.querySelectorAll('.toc-item a').forEach(el => el.classList.remove('active'));
                                currentActive.classList.add('active');
                            }
                        }, 50);
                    }, { passive: true });
                }

                // Render KaTeX Math Formulas safely
                try {
                    if (typeof renderMathInElement !== 'undefined') {
                        renderMathInElement(document.getElementById('content'), {
                            delimiters: [
                                {left: '$$', right: '$$', display: true},
                                {left: '$', right: '$', display: false}
                            ],
                            throwOnError: false
                        });
                    }
                } catch (e) {
                    console.warn('KaTeX render warning:', e);
                }

                // Wrap Mermaid blocks in interactive card containers with smooth Pan & Zoom controls
                try {
                    const codeBlocks = document.querySelectorAll('pre code.language-mermaid');
                    let diagramIndex = 0;

                    for (const block of codeBlocks) {
                        const pre = block.parentElement;
                        const mermaidCode = block.textContent;
                        const cardId = `diagram-card-${diagramIndex}`;
                        const scalableId = `diagram-scale-${diagramIndex}`;
                        const viewportId = `diagram-viewport-${diagramIndex}`;

                        const card = document.createElement('div');
                        card.className = 'diagram-card';
                        card.id = cardId;
                        card.innerHTML = `
                            <div class="diagram-topbar">
                                <div class="diagram-title-group">
                                    <span class="diagram-badge">INTERACTIVE DIAGRAM</span>
                                    <span class="diagram-hint">Click & Drag to Pan • Scroll to Zoom</span>
                                </div>
                                <div class="diagram-controls">
                                    <button class="zoom-btn" onclick="zoomDiagram('${scalableId}', 1.25)" title="Zoom In (+)">＋ Zoom In</button>
                                    <button class="zoom-btn" onclick="zoomDiagram('${scalableId}', 0.8)" title="Zoom Out (-)">－ Zoom Out</button>
                                    <button class="zoom-btn" onclick="resetDiagram('${scalableId}')" title="Fit to View">⟲ Fit / Reset</button>
                                    <button class="zoom-btn" onclick="fullscreenDiagram('${cardId}')" title="Toggle Fullscreen">⛶ Fullscreen</button>
                                </div>
                            </div>
                            <div class="diagram-viewport" id="${viewportId}">
                                <div class="diagram-scalable" id="${scalableId}">
                                    <div class="mermaid">${mermaidCode}</div>
                                </div>
                            </div>
                        `;

                        pre.replaceWith(card);
                        diagramIndex++;
                    }

                    if (typeof mermaid !== 'undefined') {
                        if (document.fonts) {
                            await document.fonts.ready;
                        }
                        await mermaid.run();
                    }

                    // Attach Pan & Zoom event listeners to all diagrams
                    for (let i = 0; i < diagramIndex; i++) {
                        const vp = document.getElementById(`diagram-viewport-${i}`);
                        const sc = document.getElementById(`diagram-scale-${i}`);
                        if (vp && sc) {
                            initDiagramPanZoom(vp, sc, `diagram-scale-${i}`);
                        }
                    }
                } catch (e) {
                    console.warn('Mermaid render warning:', e);
                }

                // Highlight code syntax safely
                try {
                    if (typeof hljs !== 'undefined') {
                        hljs.highlightAll();
                    }
                } catch (e) {
                    console.warn('hljs warning:', e);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('content').innerHTML = `<p style="color: #f85149;">Failed to load documentation: ${err.message}</p>`;
            }
        }

        // Search Filter (filters both main content and sidebar items)
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase().trim();
            
            // Filter TOC items
            document.querySelectorAll('.toc-item').forEach(li => {
                if (!term) {
                    li.style.display = '';
                } else {
                    const match = li.textContent.toLowerCase().includes(term);
                    li.style.display = match ? '' : 'none';
                }
            });

            // Filter Content blocks
            document.querySelectorAll('#content h1, #content h2, #content h3, #content p, #content tr, #content .diagram-card, #content blockquote').forEach(el => {
                if (!term) {
                    el.style.display = '';
                } else {
                    const match = el.textContent.toLowerCase().includes(term);
                    el.style.display = match ? '' : 'none';
                }
            });
        });

        // Keyboard Shortcut for Search ('/' key)
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
                e.preventDefault();
                const s = document.getElementById('searchInput');
                if (s) {
                    s.focus();
                    s.select();
                }
            }
        });

        // Initialize on page load
        loadMarkdown();
    </script>
</body>
</html>
